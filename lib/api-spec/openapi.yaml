openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: consultations
    description: Consultation request operations
  - name: applications
    description: Internet service application operations
  - name: landing-pages
    description: Landing page management
paths:
  /landing-pages/{slug}:
    get:
      operationId: getPublishedLandingPage
      tags: [landing-pages]
      summary: View a published landing page
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Published landing page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LandingPage" }
        "404":
          description: Not found or not published
  /landing-pages/{slug}/leads:
    post:
      operationId: createLandingLead
      tags: [landing-pages]
      summary: Submit a consultation request from a published landing page
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LandingLeadInput" }
      responses:
        "201":
          description: Request received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LandingLeadReceipt" }
        "400":
          description: Invalid submission or consent missing
        "404":
          description: Page not published
  /admin/landing-pages:
    get:
      operationId: listLandingPages
      tags: [landing-pages]
      summary: List pages for authorized content administrators
      responses:
        "200":
          description: Pages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LandingPage" }
    post:
      operationId: createLandingPage
      tags: [landing-pages]
      summary: Create a landing page
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LandingPageInput" }
      responses:
        "201":
          description: Created page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LandingPage" }
  /admin/landing-pages/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: updateLandingPage
      tags: [landing-pages]
      summary: Update a landing page
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LandingPageInput" }
      responses:
        "200":
          description: Updated page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LandingPage" }
    delete:
      operationId: deleteLandingPage
      tags: [landing-pages]
      summary: Delete a landing page
      responses:
        "204":
          description: Deleted
  /admin/landing-pages/{id}/duplicate:
    post:
      operationId: duplicateLandingPage
      tags: [landing-pages]
      summary: Duplicate a page as an unpublished draft
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Draft copy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LandingPage" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /consultations:
    post:
      operationId: createConsultation
      tags: [consultations]
      summary: Create a consultation request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsultationRequest"
      responses:
        "201":
          description: Consultation request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /applications:
    post:
      operationId: createApplication
      tags: [applications]
      summary: Submit a full internet service application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    LandingPageInput:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        category: { type: string, enum: ["당근마켓", "구글광고", "일반/기타"] }
        eyebrow: { type: string }
        headline: { type: string }
        description: { type: string }
        benefits: { type: string }
        comparison: { type: string, description: "One provider|plan|price|benefit per line" }
        faqs: { type: string, description: "One question|answer per line" }
        galleryImages: { type: string, description: "One image URL per line" }
        ctaLabel: { type: string }
        ctaUrl: { type: string }
        imageUrl: { type: ["string", "null"] }
        isPublished: { type: boolean }
      required: [slug, title, category, eyebrow, headline, description, benefits, comparison, faqs, galleryImages, ctaLabel, ctaUrl, imageUrl, isPublished]
    LandingLeadInput:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        preferredProvider: { type: string, enum: ["KT", "SK", "LG", "미정"] }
        consent: { type: boolean, description: "Explicit consultation privacy consent" }
      required: [name, phone, consent]
    LandingLeadReceipt:
      type: object
      properties:
        id: { type: integer }
      required: [id]
    LandingPage:
      allOf:
        - $ref: "#/components/schemas/LandingPageInput"
        - type: object
          properties:
            id: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
          required: [id, createdAt, updatedAt]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CreateConsultationRequest:
      type: object
      properties:
        name:
          type: string
          description: 고객 이름
        phone:
          type: string
          description: 고객 연락처
      required:
        - name
        - phone
    ConsultationResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        status:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - phone
    CreateApplicationRequest:
      type: object
      properties:
        currentProvider:
          type: string
        applyProvider:
          type: string
        internet:
          type: string
        tv:
          type: string
        customerType:
          type: string
        paymentMethod:
          type: string
        payBank:
          type: string
        payAccount:
          type: string
        payAccountHolder:
          type: string
        cardCompany:
          type: string
        cardNumber:
          type: string
        cardExpiry:
          type: string
        giftBank:
          type: string
        giftAccount:
          type: string
        giftAccountHolder:
          type: string
        name:
          type: string
        phoneCarrier:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        memo:
          type: string
      required:
        - name
        - phone
        - applyProvider
    ApplicationResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        applyProvider:
          type: string
        status:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - phone
        - applyProvider
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
