kind = "mobile"
previewPath = "/internet-mobile/"
title = "AI인터넷 모바일"
description = "인터넷 가입 사은품 비교 및 상담 신청 모바일 앱. SK브로드밴드, KT, LG U+ 등 통신사별 사은품과 요금제를 한눈에 비교하고, 간편하게 상담 신청을 할 수 있는 앱입니다."
version = "1.0.0"
id = "artifacts/internet-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/internet-mobile/" ]
localPort = 19466

[services.development]
run = "pnpm --filter @workspace/internet-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/internet-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/internet-mobile", "run", "serve" ]

[services.env]
PORT = "19466"
BASE_PATH = "/internet-mobile/"
